name: ci-selftest

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/ci-selftest.yml"
      - "selftest/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/ci-selftest.yml"
      - "selftest/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run actionlint
        shell: bash
        # Both the installer script and the binary version are pinned to
        # the same tag so a compromised `main` of rhysd/actionlint can't
        # inject code into the CI environment. Bump both together.
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "${ACTIONLINT_VERSION}"
          ./actionlint -color .github/workflows/ci.yml .github/workflows/ci-selftest.yml

  selftest-python:
    name: selftest python
    needs: actionlint
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      language: python
      working-directory: selftest/python

  selftest-node:
    name: selftest node
    needs: actionlint
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      language: node
      working-directory: selftest/node

  selftest-go:
    name: selftest go
    needs: actionlint
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      language: go
      working-directory: selftest/go
